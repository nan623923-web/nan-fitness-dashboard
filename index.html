<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="个人力量训练、跑步与连续打卡可视化档案">
  <title>我的健身档案</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23101010'/%3E%3Cpath d='M15 22v20M22 17v30M42 17v30M49 22v20M22 32h20' stroke='%239269ff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
:root {
  color-scheme: dark;
  --bg: #101010;
  --surface: #151515;
  --surface-2: #191919;
  --line: #292929;
  --text: #f1f1f3;
  --muted: #89878f;
  --purple-1: #2c2240;
  --purple-2: #493078;
  --purple-3: #6d42bd;
  --purple-4: #9664f4;
  --accent: #a77bff;
  --cell: 14px;
  --gap: 5px;
  font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html {
  background: var(--bg);
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  color: var(--text);
  background:
    radial-gradient(circle at 50% -20%, rgba(137, 83, 255, .13), transparent 38%),
    var(--bg);
  -webkit-font-smoothing: antialiased;
}

button, a { font: inherit; }

.topbar {
  width: min(1110px, calc(100% - 36px));
  height: 58px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #d8d7da;
  font-size: .95rem;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: inherit;
  text-decoration: none;
  font-weight: 650;
}

.brand-mark {
  width: 11px;
  height: 11px;
  border-radius: 3px;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(167, 123, 255, .55);
}

.privacy {
  color: var(--muted);
  font-size: .88rem;
}

.lock { color: #aaa8ae; margin-right: 3px; }

.page {
  width: min(1030px, calc(100% - 36px));
  margin: 0 auto;
  padding: 4px 0 38px;
}

.profile {
  text-align: center;
  padding: 4px 0 28px;
}

.avatar {
  width: 82px;
  height: 82px;
  margin: 0 auto 14px;
  padding: 3px;
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 50%;
  background: #1a1a1a;
  box-shadow: 0 18px 55px rgba(73, 32, 150, .28);
}

.avatar svg {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: inherit;
}

h1 {
  margin: 0;
  font-size: 2rem;
  line-height: 1.2;
  letter-spacing: -.045em;
  font-weight: 720;
}

.handle {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: .95rem;
}

.stats {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  margin-bottom: 38px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: rgba(22,22,22,.72);
  overflow: hidden;
  box-shadow: inset 0 1px rgba(255,255,255,.015);
}

.stats article {
  position: relative;
  min-width: 0;
  padding: 17px 10px 16px;
  text-align: center;
}

.stats article + article::before {
  content: "";
  position: absolute;
  left: 0;
  top: 18px;
  bottom: 18px;
  width: 1px;
  background: var(--line);
}

.stats strong {
  display: block;
  color: #fff;
  font-size: 1.16rem;
  line-height: 1.25;
  font-variant-numeric: tabular-nums;
}

.stats span {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: .82rem;
  white-space: nowrap;
}

.activity {
  margin-bottom: 36px;
}

.section-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 15px;
}

h2 {
  margin: 0;
  color: #f3f2f4;
  font-size: 1.02rem;
  line-height: 1.4;
  font-weight: 700;
}

.section-heading p {
  margin: 4px 0 0;
  color: #6f6d75;
  font-size: .82rem;
}

.tabs {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 3px;
  border-radius: 10px;
  background: #151515;
}

.tab {
  min-height: 34px;
  padding: 6px 13px;
  border: 0;
  border-radius: 8px;
  color: #74727a;
  background: transparent;
  cursor: pointer;
  font-size: .9rem;
  font-weight: 650;
}

.tab:hover { color: #b8b6bc; }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.tab.active {
  color: #f4f3f5;
  background: #242126;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
}

.view-panel {
  min-height: 190px;
  padding: 19px 20px 14px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgba(20,20,20,.68);
}

.view-panel[hidden] { display: none; }

.heatmap-scroll {
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: 6px;
  scrollbar-width: thin;
  scrollbar-color: #3a2c55 transparent;
}

.heatmap-layout {
  display: grid;
  grid-template-columns: 25px max-content;
  grid-template-rows: 18px max-content;
  gap: 7px 9px;
  min-width: 100%;
  justify-content: center;
}

.month-labels {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: var(--cell);
  gap: var(--gap);
  height: 18px;
  color: #75727a;
  font-size: .73rem;
  line-height: 1;
}

.month-labels span {
  white-space: nowrap;
  transform: translateY(2px);
}

.weekday-labels {
  display: grid;
  grid-template-rows: repeat(7, var(--cell));
  gap: var(--gap);
  color: #646169;
  font-size: .7rem;
  line-height: var(--cell);
  text-align: right;
}

.heatmap {
  display: grid;
  grid-template-rows: repeat(7, var(--cell));
  grid-auto-flow: column;
  grid-auto-columns: var(--cell);
  gap: var(--gap);
}

.heat-cell {
  width: var(--cell);
  height: var(--cell);
  padding: 0;
  border: 0;
  border-radius: 4px;
  background: #202020;
  cursor: default;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.012);
  transition: transform .12s ease, filter .12s ease;
}

.heat-cell:not(.future):hover,
.heat-cell:focus-visible {
  z-index: 2;
  transform: scale(1.32);
  filter: brightness(1.2);
  outline: 1px solid rgba(255,255,255,.44);
  outline-offset: 1px;
}

.heat-cell.future { opacity: .28; }
.level-0 { background: #202020; }
.level-1 { background: var(--purple-1); }
.level-2 { background: var(--purple-2); }
.level-3 { background: var(--purple-3); }
.level-4 {
  background: var(--purple-4);
  box-shadow: 0 0 10px rgba(150,100,244,.28);
}

.weekly-bars {
  display: grid;
  grid-template-columns: repeat(12, minmax(42px, 1fr));
  align-items: end;
  gap: 12px;
  height: 202px;
  padding: 9px 0 3px;
}

.week {
  display: grid;
  grid-template-rows: 1fr auto;
  align-items: end;
  gap: 7px;
  height: 100%;
  min-width: 0;
}

.week-bar-wrap {
  height: 100%;
  display: flex;
  align-items: end;
  justify-content: center;
  border-bottom: 1px solid #27252a;
}

.week-bar {
  width: min(30px, 74%);
  min-height: 3px;
  border-radius: 7px 7px 2px 2px;
  background: linear-gradient(180deg, #9c6aff, #553091);
  box-shadow: 0 -5px 22px rgba(136, 79, 243, .16);
}

.week-label {
  color: #6e6b73;
  font-size: .68rem;
  text-align: center;
  white-space: nowrap;
}

.cumulative-chart {
  height: 214px;
}

.cumulative-chart svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

.details {
  display: grid;
  grid-template-columns: .96fr 1.04fr;
  gap: 52px;
}

.details article {
  min-width: 0;
}

.details h2 {
  margin-bottom: 13px;
}

.insights dl {
  margin: 0;
}

.insights dl div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  min-height: 40px;
  border-bottom: 1px solid #1d1d1d;
}

.insights dt {
  color: var(--muted);
  font-size: .91rem;
}

.insights dd {
  margin: 0;
  color: #ecebee;
  font-size: .92rem;
  font-weight: 650;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.recent-list {
  display: grid;
  gap: 4px;
}

.recent-row {
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr) auto;
  align-items: center;
  gap: 11px;
  min-height: 45px;
}

.recent-icon {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  color: #d6c7ff;
  background: #24202b;
  border: 1px solid #332a42;
  font-size: .9rem;
  font-weight: 750;
}

.recent-main {
  min-width: 0;
}

.recent-main strong {
  display: block;
  overflow: hidden;
  color: #e5e3e7;
  font-size: .9rem;
  font-weight: 620;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.recent-main span,
.recent-value {
  color: #79767e;
  font-size: .78rem;
}

.recent-value {
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.tooltip {
  position: fixed;
  z-index: 50;
  width: min(330px, calc(100vw - 28px));
  padding: 11px 12px;
  border: 1px solid #3a3442;
  border-radius: 11px;
  color: #eae8ed;
  background: rgba(25,23,28,.97);
  box-shadow: 0 16px 48px rgba(0,0,0,.46);
  pointer-events: none;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity .1s ease, transform .1s ease;
}

.tooltip.show {
  opacity: 1;
  transform: translateY(0);
}

.tooltip strong {
  display: block;
  margin-bottom: 5px;
  color: #fff;
  font-size: .84rem;
}

.tooltip span {
  display: block;
  color: #aaa6af;
  font-size: .78rem;
  line-height: 1.55;
}

@media (max-width: 760px) {
  .topbar { width: min(100% - 28px, 1030px); }
  .privacy { font-size: .75rem; }
  .lock { display: none; }
  .page { width: min(100% - 28px, 1030px); }
  .profile { padding-top: 10px; padding-bottom: 23px; }
  h1 { font-size: 1.7rem; }
  .stats {
    grid-template-columns: repeat(2, 1fr);
    border-radius: 17px;
  }
  .stats article:last-child { grid-column: 1 / -1; }
  .stats article:nth-child(odd)::before { display: none; }
  .stats article:last-child::before { display: none; }
  .stats article { border-bottom: 1px solid var(--line); }
  .stats article:nth-last-child(-n+1) { border-bottom: 0; }
  .section-heading {
    align-items: flex-start;
    flex-direction: column;
    gap: 12px;
  }
  .tabs { align-self: stretch; }
  .tab { flex: 1; }
  .view-panel { padding: 15px 14px 12px; }
  .weekly-bars { min-width: 690px; }
  #weeklyView { overflow-x: auto; }
  .details { grid-template-columns: 1fr; gap: 32px; }
}

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; }
}

</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top" aria-label="回到顶部">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>个人健身档案</span>
    </a>
    <div class="privacy"><span class="lock" aria-hidden="true">⌾</span> 公开 · 数据截至 <span id="asOf">—</span></div>
  </header>

  <main id="top" class="page">
    <section class="profile" aria-labelledby="profileTitle">
      <div class="avatar" aria-hidden="true">
        <svg viewBox="0 0 80 80" role="img">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#b69cff"/>
              <stop offset="1" stop-color="#6c35e8"/>
            </linearGradient>
          </defs>
          <circle cx="40" cy="40" r="40" fill="url(#g)"/>
          <path d="M19 29v22M27 23v34M53 23v34M61 29v22M27 40h26" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 id="profileTitle">我的健身档案</h1>
      <p class="handle">@nan · 持续训练中</p>
    </section>

    <section class="stats" aria-label="核心统计">
      <article><strong id="totalReps">—</strong><span>累计力量次数</span></article>
      <article><strong id="totalKm">—</strong><span>累计跑步公里</span></article>
      <article><strong id="activeDays">—</strong><span>累计打卡天数</span></article>
      <article><strong id="currentStreak">—</strong><span>当前连续天数</span></article>
      <article><strong id="longestStreak">—</strong><span>最长连续天数</span></article>
    </section>

    <section class="activity" aria-labelledby="activityTitle">
      <div class="section-heading">
        <div>
          <h2 id="activityTitle">训练活动</h2>
          <p id="activityCaption">颜色越亮，代表当天训练量越大</p>
        </div>
        <div class="tabs" role="tablist" aria-label="活动视图">
          <button class="tab active" type="button" role="tab" aria-selected="true" data-view="daily">每日</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-view="weekly">每周</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-view="cumulative">累计</button>
        </div>
      </div>

      <div id="dailyView" class="view-panel active" role="tabpanel">
        <div class="heatmap-scroll">
          <div class="heatmap-layout">
            <div aria-hidden="true"></div>
            <div id="monthLabels" class="month-labels" aria-hidden="true"></div>
            <div class="weekday-labels" aria-hidden="true">
              <span></span><span>一</span><span></span><span>三</span><span></span><span>五</span><span></span>
            </div>
            <div id="heatmap" class="heatmap" aria-label="过去一年的每日训练热力图"></div>
          </div>
        </div>
      </div>

      <div id="weeklyView" class="view-panel" role="tabpanel" hidden>
        <div id="weeklyBars" class="weekly-bars" aria-label="近十二周训练量"></div>
      </div>

      <div id="cumulativeView" class="view-panel" role="tabpanel" hidden>
        <div class="cumulative-chart">
          <svg id="cumulativeChart" viewBox="0 0 980 230" role="img" aria-label="累计打卡趋势"></svg>
        </div>
      </div>
    </section>

    <section class="details">
      <article class="insights">
        <h2>训练洞察</h2>
        <dl>
          <div><dt>力量训练天数</dt><dd id="strengthDays">—</dd></div>
          <div><dt>跑步天数</dt><dd id="runDays">—</dd></div>
          <div><dt>累计力量组数</dt><dd id="totalSets">—</dd></div>
          <div><dt>最常训练类型</dt><dd id="favoriteType">—</dd></div>
          <div><dt>力量训练达标率</dt><dd id="passRate">—</dd></div>
        </dl>
      </article>

      <article class="recent">
        <h2>最近训练</h2>
        <div id="recentList" class="recent-list"></div>
      </article>
    </section>
  </main>

  <div id="tooltip" class="tooltip" role="status" aria-live="polite"></div>

  <script>
(() => {
  const data = window.FITNESS_DATA;
  if (!data || !Array.isArray(data.entries)) return;

  const entries = [...data.entries].sort((a, b) => a.date.localeCompare(b.date));
  const byDate = new Map(entries.map((entry) => [entry.date, entry]));
  const activeDates = new Set(entries.map((entry) => entry.date));
  const asOf = parseDate(data.asOf);

  const totalReps = sum(entries.map((entry) => entry.strengthReps));
  const totalKm = sum(entries.map((entry) => entry.runKm));
  const totalSets = sum(entries.map((entry) => entry.sets));
  const strengthEntries = entries.filter((entry) => entry.strengthReps > 0);
  const runEntries = entries.filter((entry) => entry.runKm > 0);
  const currentStreak = streakEndingAt(asOf, activeDates);
  const longestStreak = longest(activeDates);
  const passCount = strengthEntries.filter((entry) => ["达标", "完美"].includes(entry.rating)).length;

  setText("asOf", formatShort(asOf));
  setText("totalReps", totalReps.toLocaleString("zh-CN"));
  setText("totalKm", totalKm.toFixed(1));
  setText("activeDays", `${entries.length} 天`);
  setText("currentStreak", `${currentStreak} 天`);
  setText("longestStreak", `${longestStreak} 天`);
  setText("strengthDays", `${strengthEntries.length} 天`);
  setText("runDays", `${runEntries.length} 天`);
  setText("totalSets", `${totalSets} 组`);
  setText("favoriteType", favoriteType(strengthEntries));
  setText("passRate", strengthEntries.length ? `${Math.round(passCount / strengthEntries.length * 100)}%` : "—");

  buildHeatmap();
  buildWeekly();
  buildCumulative();
  buildRecent();
  bindTabs();

  function parseDate(value) {
    return new Date(`${value}T00:00:00+08:00`);
  }

  function isoDate(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  function addDays(date, days) {
    const next = new Date(date);
    next.setDate(next.getDate() + days);
    return next;
  }

  function sum(numbers) {
    return numbers.reduce((total, value) => total + Number(value || 0), 0);
  }

  function setText(id, value) {
    const node = document.getElementById(id);
    if (node) node.textContent = value;
  }

  function formatShort(date) {
    return `${date.getMonth() + 1}月${date.getDate()}日`;
  }

  function formatDate(date) {
    const weekdays = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
    return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 · ${weekdays[date.getDay()]}`;
  }

  function volume(entry) {
    return (entry?.strengthReps || 0) + (entry?.runKm || 0) * 20;
  }

  function level(entry) {
    const value = volume(entry);
    if (!value) return 0;
    if (value <= 30) return 1;
    if (value <= 70) return 2;
    if (value <= 120) return 3;
    return 4;
  }

  function streakEndingAt(date, set) {
    let count = 0;
    let cursor = new Date(date);
    while (set.has(isoDate(cursor))) {
      count += 1;
      cursor = addDays(cursor, -1);
    }
    return count;
  }

  function longest(set) {
    let best = 0;
    let current = 0;
    const sorted = [...set].sort();
    let previous = null;
    for (const value of sorted) {
      const date = parseDate(value);
      if (previous && (date - previous) / 86400000 === 1) current += 1;
      else current = 1;
      best = Math.max(best, current);
      previous = date;
    }
    return best;
  }

  function favoriteType(list) {
    const counts = new Map();
    for (const entry of list) counts.set(entry.type, (counts.get(entry.type) || 0) + 1);
    const top = [...counts.entries()].sort((a, b) => b[1] - a[1])[0];
    return top ? `${top[0]} · ${top[1]}天` : "—";
  }

  function buildHeatmap() {
    const heatmap = document.getElementById("heatmap");
    const labels = document.getElementById("monthLabels");
    heatmap.replaceChildren();
    labels.replaceChildren();

    let start = addDays(asOf, -364);
    start = addDays(start, -start.getDay());
    const end = addDays(asOf, 6 - asOf.getDay());
    const totalDays = Math.round((end - start) / 86400000) + 1;
    const totalWeeks = Math.ceil(totalDays / 7);

    labels.style.gridTemplateColumns = `repeat(${totalWeeks}, var(--cell))`;
    const monthAtWeek = new Map();
    let previousMonth = null;

    for (let index = 0; index < totalDays; index += 1) {
      const date = addDays(start, index);
      const key = isoDate(date);
      const entry = byDate.get(key);
      const cell = document.createElement("button");
      cell.type = "button";
      cell.className = `heat-cell level-${level(entry)}${date > asOf ? " future" : ""}`;
      cell.dataset.date = key;
      cell.setAttribute("aria-label", heatAria(date, entry));

      cell.addEventListener("mouseenter", (event) => showTooltip(event.currentTarget, date, entry));
      cell.addEventListener("mousemove", (event) => positionTooltip(event.clientX, event.clientY));
      cell.addEventListener("mouseleave", hideTooltip);
      cell.addEventListener("focus", (event) => showTooltip(event.currentTarget, date, entry));
      cell.addEventListener("blur", hideTooltip);
      cell.addEventListener("click", (event) => showTooltip(event.currentTarget, date, entry));
      heatmap.appendChild(cell);

      const week = Math.floor(index / 7);
      const monthKey = `${date.getFullYear()}-${date.getMonth()}`;
      if (monthKey !== previousMonth) {
        monthAtWeek.set(week, `${date.getMonth() + 1}月`);
        previousMonth = monthKey;
      }
    }

    for (let week = 0; week < totalWeeks; week += 1) {
      const label = document.createElement("span");
      label.textContent = monthAtWeek.get(week) || "";
      labels.appendChild(label);
    }

    const scrollArea = heatmap.closest(".heatmap-scroll");
    requestAnimationFrame(() => {
      if (scrollArea) scrollArea.scrollLeft = scrollArea.scrollWidth;
    });

  }

  function heatAria(date, entry) {
    if (date > asOf) return `${formatDate(date)}，未来日期`;
    if (!entry) return `${formatDate(date)}，未训练`;
    const detail = [
      entry.strengthReps ? `力量${entry.strengthReps}次` : "",
      entry.runKm ? `跑步${entry.runKm}公里` : ""
    ].filter(Boolean).join("，");
    return `${formatDate(date)}，${detail}，${entry.rating}`;
  }

  function showTooltip(target, date, entry) {
    const tooltip = document.getElementById("tooltip");
    const title = document.createElement("strong");
    const text = document.createElement("span");
    title.textContent = formatDate(date);
    if (date > asOf) text.textContent = "未来日期";
    else if (!entry) text.textContent = "未训练";
    else {
      const amounts = [];
      if (entry.strengthReps) amounts.push(`力量 ${entry.strengthReps} 次 / ${entry.sets} 组`);
      if (entry.runKm) amounts.push(`跑步 ${entry.runKm} 公里`);
      text.textContent = `${entry.type} · ${amounts.join(" · ")} · ${entry.rating}。 ${entry.summary}`;
    }
    tooltip.replaceChildren(title, text);
    tooltip.classList.add("show");
    const rect = target.getBoundingClientRect();
    positionTooltip(rect.left + rect.width / 2, rect.top - 8);
  }

  function positionTooltip(x, y) {
    const tooltip = document.getElementById("tooltip");
    if (!tooltip.classList.contains("show")) return;
    const margin = 12;
    const width = tooltip.offsetWidth;
    const height = tooltip.offsetHeight;
    const left = Math.max(margin, Math.min(window.innerWidth - width - margin, x - width / 2));
    let top = y - height - 12;
    if (top < margin) top = y + 18;
    tooltip.style.left = `${left}px`;
    tooltip.style.top = `${top}px`;
  }

  function hideTooltip() {
    document.getElementById("tooltip").classList.remove("show");
  }

  function buildWeekly() {
    const holder = document.getElementById("weeklyBars");
    holder.replaceChildren();
    const endOfWeek = addDays(asOf, 6 - asOf.getDay());
    const weeks = [];

    for (let offset = 11; offset >= 0; offset -= 1) {
      const start = addDays(endOfWeek, -offset * 7 - 6);
      const end = addDays(start, 6);
      const weekEntries = entries.filter((entry) => {
        const day = parseDate(entry.date);
        return day >= start && day <= end;
      });
      weeks.push({
        start,
        active: weekEntries.length,
        volume: sum(weekEntries.map(volume))
      });
    }

    const max = Math.max(1, ...weeks.map((week) => week.volume));
    weeks.forEach((week) => {
      const item = document.createElement("div");
      item.className = "week";
      item.title = `${week.start.getMonth() + 1}/${week.start.getDate()} 起：${week.active}天，训练量 ${Math.round(week.volume)}`;
      const wrap = document.createElement("div");
      wrap.className = "week-bar-wrap";
      const bar = document.createElement("div");
      bar.className = "week-bar";
      bar.style.height = `${Math.max(3, week.volume / max * 100)}%`;
      wrap.appendChild(bar);
      const label = document.createElement("span");
      label.className = "week-label";
      label.textContent = `${week.start.getMonth() + 1}/${week.start.getDate()}`;
      item.append(wrap, label);
      holder.appendChild(item);
    });
  }

  function buildCumulative() {
    const svg = document.getElementById("cumulativeChart");
    const width = 980;
    const height = 230;
    const padX = 28;
    const padY = 24;
    const start = addDays(asOf, -364);
    const span = Math.max(1, (asOf - start) / 86400000);
    const points = [{ date: start, value: 0 }];
    let count = 0;
    entries.filter((entry) => parseDate(entry.date) >= start).forEach((entry) => {
      count += 1;
      points.push({ date: parseDate(entry.date), value: count });
    });
    points.push({ date: asOf, value: count });
    const maxY = Math.max(1, count);
    const coords = points.map((point) => {
      const x = padX + ((point.date - start) / 86400000) / span * (width - padX * 2);
      const y = height - padY - point.value / maxY * (height - padY * 2);
      return [x, y];
    });
    const line = coords.map((point) => point.join(",")).join(" ");
    const area = `${padX},${height - padY} ${line} ${width - padX},${height - padY}`;
    svg.innerHTML = `
      <defs>
        <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9564f4" stop-opacity=".42"/>
          <stop offset="1" stop-color="#9564f4" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <line x1="${padX}" y1="${height - padY}" x2="${width - padX}" y2="${height - padY}" stroke="#2a282d"/>
      <line x1="${padX}" y1="${padY}" x2="${padX}" y2="${height - padY}" stroke="#2a282d"/>
      <polygon points="${area}" fill="url(#areaFill)"/>
      <polyline points="${line}" fill="none" stroke="#9a68f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${coords.at(-1)[0]}" cy="${coords.at(-1)[1]}" r="6" fill="#b68cff" stroke="#17141d" stroke-width="3"/>
      <text x="${width - padX}" y="${Math.max(18, coords.at(-1)[1] - 12)}" text-anchor="end" fill="#d9cdf2" font-size="14">${count} 天</text>
      <text x="${padX}" y="${height - 5}" fill="#6f6b74" font-size="12">过去一年</text>
      <text x="${width - padX}" y="${height - 5}" text-anchor="end" fill="#6f6b74" font-size="12">今天</text>
    `;
  }

  function buildRecent() {
    const holder = document.getElementById("recentList");
    holder.replaceChildren();
    entries.slice(-5).reverse().forEach((entry) => {
      const row = document.createElement("div");
      row.className = "recent-row";
      const icon = document.createElement("span");
      icon.className = "recent-icon";
      icon.textContent = entry.runKm > 0 && !entry.strengthReps ? "跑" : "练";
      const main = document.createElement("div");
      main.className = "recent-main";
      const title = document.createElement("strong");
      title.textContent = entry.type;
      const date = document.createElement("span");
      date.textContent = `${parseDate(entry.date).getMonth() + 1}月${parseDate(entry.date).getDate()}日 · ${entry.rating}`;
      main.append(title, date);
      const value = document.createElement("span");
      value.className = "recent-value";
      value.textContent = entry.runKm && !entry.strengthReps
        ? `${entry.runKm} km`
        : `${entry.strengthReps} 次${entry.runKm ? ` + ${entry.runKm} km` : ""}`;
      row.append(icon, main, value);
      row.title = entry.summary;
      holder.appendChild(row);
    });
  }

  function bindTabs() {
    const captions = {
      daily: "颜色越亮，代表当天训练量越大",
      weekly: "近十二周的综合训练量",
      cumulative: "过去一年累计打卡天数"
    };
    document.querySelectorAll(".tab").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((tab) => {
          const active = tab === button;
          tab.classList.toggle("active", active);
          tab.setAttribute("aria-selected", String(active));
        });
        document.querySelectorAll(".view-panel").forEach((panel) => {
          const active = panel.id === `${button.dataset.view}View`;
          panel.hidden = !active;
          panel.classList.toggle("active", active);
        });
        setText("activityCaption", captions[button.dataset.view]);
        hideTooltip();
      });
    });
  }
})();
  </script>
</body>
</html>
